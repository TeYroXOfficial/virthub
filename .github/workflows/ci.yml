name: CI

on:
  push:
    branches: [main]
  pull_request:

# Anuluj poprzedni przebieg dla tej samej gałęzi — nikt nie czeka na wynik
# testów sprzed trzech commitów.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane (Laravel)
    runs-on: ubuntu-latest

    # Prawdziwy MariaDB do testu baz danych aplikacji (AppDatabasesMysqlTest).
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: vhadmin-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, bcmath, curl, zip
          coverage: none

      - name: Cache zależności Composera
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('control-plane/composer.lock') }}

      - name: Instalacja zależności
        working-directory: control-plane
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Konfiguracja środowiska
        working-directory: control-plane
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testy
        working-directory: control-plane
        env:
          VIRTHUB_TEST_MYSQL_HOST: 127.0.0.1
          VIRTHUB_TEST_MYSQL_USER: root
          VIRTHUB_TEST_MYSQL_PASSWORD: vhadmin-pass
        run: php artisan test

  license-server:
    name: License server (Laravel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, zip
          coverage: none

      - name: Instalacja zależności
        working-directory: license-server
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Testy
        working-directory: license-server
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  node-agent:
    name: Node agent (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: node-agent/requirements.txt

      - name: Instalacja zależności
        working-directory: node-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Testy
        working-directory: node-agent
        run: pytest -q
